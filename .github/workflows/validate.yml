name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Structure, denylist, matrix drift, aliases
        run: python3 scripts/skills.py validate

      - name: Generated outputs match source
        run: python3 scripts/skills.py build --check

      - name: Tooling smoke tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

  upstream-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical skills
        uses: actions/checkout@v4
        with:
          path: agentmail-skills

      - name: Checkout canonical MCP contract
        uses: actions/checkout@v4
        with:
          repository: agentmail-to/agentmail-mcp
          path: agentmail-mcp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check skills against the current MCP manifest
        working-directory: agentmail-skills
        run: python3 scripts/skills.py sync --check --backend ../agentmail-mcp
